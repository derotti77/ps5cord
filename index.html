<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5Cord</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e1f22; color: #b5bac1;
    font-family: "SST", "Helvetica Neue", Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
  .logo { width: 140px; height: 140px; border-radius: 36px; background: #5865f2; display: flex;
    align-items: center; justify-content: center; font-size: 72px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(0.92); opacity: 0.8; } }
  #msg { font-size: 30px; text-align: center; max-width: 1200px; line-height: 1.4; }
  .dim { font-size: 22px; color: #80848e; }
</style>
</head>
<body>
  <div class="logo">💬</div>
  <div id="msg">Starte PS5Cord …</div>
<script>
/* Starter fuer die PS5Cord-Vollbild-App.
 * PS5-Web-Apps duerfen nur HTTPS-Seiten laden, aber zu einer lokalen Adresse
 * navigieren. Diese Seite prueft per Bild, ob der PS5Cord-Dienst auf der
 * Konsole laeuft, und leitet dann zur eigentlichen Oberflaeche weiter. */
(function () {
  var LOCAL = "http://127.0.0.1:8645";
  var tries = 0;
  function check() {
    var img = new Image();
    var done = false;
    var timer = setTimeout(function () { fail(); }, 4000);
    function fail() {
      if (done) return;
      done = true;
      clearTimeout(timer);
      tries++;
      document.getElementById("msg").innerHTML =
        "PS5Cord-Dienst nicht erreichbar.<br>" +
        '<span class="dim">Sende den PS5Cord-Payload (ps5cord.elf) an die Konsole. ' +
        "Neuer Versuch läuft automatisch … (" + tries + ")</span>";
      setTimeout(check, 2500);
    }
    img.onload = function () {
      if (done) return;
      done = true;
      clearTimeout(timer);
      location.replace(LOCAL + "/?app=1");
    };
    img.onerror = fail;
    img.src = LOCAL + "/api/probe?m=launcher&t=" + Date.now();
  }
  check();
})();
</script>
</body>
</html>
